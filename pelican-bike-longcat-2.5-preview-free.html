<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚴 鹈鹕骑自行车 - Pelican Bike Ride</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #87CEEB 0%, #E0F7FA 60%, #A5D6A7 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  h1 {
    color: #2E7D32;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    font-size: 2em;
  }
  .scene {
    position: relative;
    width: 800px;
    max-width: 95vw;
  }
  svg {
    width: 100%;
    height: auto;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
  }

  /* 轮子旋转动画 */
  @keyframes wheelSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .wheel {
    animation: wheelSpin 0.8s linear infinite;
    transform-origin: center;
  }

  /* 鹈鹕身体上下颠簸 */
  @keyframes bodyBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .pelican-body {
    animation: bodyBounce 0.4s ease-in-out infinite;
  }

  /* 翅膀扇动 */
  @keyframes wingFlap {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-15deg); }
  }
  .wing {
    animation: wingFlap 0.6s ease-in-out infinite;
    transform-origin: 280px 200px;
  }

  /* 腿蹬踏板 */
  @keyframes legPedal {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(15deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(-15deg); }
    100% { transform: rotate(0deg); }
  }
  .leg-front {
    animation: legPedal 0.8s ease-in-out infinite;
    transform-origin: 320px 280px;
  }
  .leg-back {
    animation: legPedal 0.8s ease-in-out infinite;
    animation-delay: 0.4s;
    transform-origin: 320px 280px;
  }

  /* 背景云朵移动 */
  @keyframes cloudMove {
    from { transform: translateX(850px); }
    to { transform: translateX(-200px); }
  }
  .cloud1 { animation: cloudMove 12s linear infinite; }
  .cloud2 { animation: cloudMove 18s linear infinite; animation-delay: -6s; }
  .cloud3 { animation: cloudMove 15s linear infinite; animation-delay: -3s; }

  /* 地面线条移动 */
  @keyframes groundMove {
    from { transform: translateX(0); }
    to { transform: translateX(-100px); }
  }
  .ground-line {
    animation: groundMove 0.5s linear infinite;
  }

  /* 太阳光芒 */
  @keyframes sunPulse {
    0%, 100% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.1); }
  }
  .sun-rays {
    animation: sunPulse 2s ease-in-out infinite;
    transform-origin: 700px 80px;
  }

  /* 鹈鹕嘴里的鱼 */
  @keyframes fishWiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(10deg); }
    75% { transform: rotate(-10deg); }
  }
  .fish {
    animation: fishWiggle 0.5s ease-in-out infinite;
    transform-origin: 380px 160px;
  }

  /* 速度线 */
  @keyframes speedLine {
    0% { opacity: 0; transform: translateX(0); }
    20% { opacity: 1; }
    100% { opacity: 0; transform: translateX(-80px); }
  }
  .speed-line {
    animation: speedLine 0.4s linear infinite;
  }
  .speed-line:nth-child(2) { animation-delay: 0.15s; }
  .speed-line:nth-child(3) { animation-delay: 0.3s; }

  .credit {
    margin-top: 15px;
    color: #558B2F;
    font-size: 0.9em;
    opacity: 0.7;
  }
</style>
</head>
